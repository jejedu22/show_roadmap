{% extends "base.html" %}{% block title %}Compagnies{% endblock %}
{% block content %}
<h1>Mes compagnies</h1>
<div class="grid g3">
{% for c in companies %}<a class="card" href="/companies/{{ c.id }}" style="text-decoration:none;color:inherit"><b>{{ c.name }}</b><div class="muted small">{{ c.shows|length }} spectacle(s)</div></a>{% else %}
<p class="muted">Aucune compagnie. Créez-en une ci-dessous.</p>{% endfor %}
</div>
<form method="post" action="/companies" class="card grid g2">
  <input type="hidden" name="csrf" value="{{ csrf(request) }}">
  <div><label>Nouvelle compagnie</label><input name="name" required></div><div style="align-self:end"><button>Créer</button></div>
</form>
{% endblock %}
