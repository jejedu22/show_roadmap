{% extends "base.html" %}{% block title %}Connexion{% endblock %}
{% block content %}
<div class="login card">
  <h1>Connexion</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="grid">
    <input type="hidden" name="csrf" value="{{ csrf(request) }}">
    <div><label>E-mail</label><input type="email" name="email" required autofocus autocomplete="username"></div>
    <div><label>Mot de passe</label><input type="password" name="password" required autocomplete="current-password"></div>
    <button>Se connecter</button>
  </form>
</div>
{% endblock %}
