{% extends "base.html" %}{% block title %}Mon compte{% endblock %}
{% block content %}
<h1>Mon compte</h1>
{% if msg %}<div class="alert">{{ msg }}</div>{% endif %}
<form method="post" class="card grid g2">
  <input type="hidden" name="csrf" value="{{ csrf(request) }}">
  <div><label>E-mail</label><input value="{{ user.email }}" disabled></div>
  <div><label>Nom affiché</label><input name="name" value="{{ user.name }}"></div>
  <div><label>Mot de passe actuel</label><input type="password" name="current" autocomplete="current-password"></div>
  <div><label>Nouveau mot de passe (10 caractères min.)</label><input type="password" name="new" autocomplete="new-password"></div>
  <div><button>Enregistrer</button></div>
</form>
{% endblock %}
