<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Show Roadmap{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">🎭 Show Roadmap</a>
  <nav>
    {% for c in nav_companies or [] %}<a href="/companies/{{ c.id }}">{{ c.name }}</a>{% endfor %}
    {% if user and user.is_admin %}<a href="/admin/users">Utilisateurs</a>{% endif %}
  </nav>
  {% if user %}
  <span class="muted small">{{ user.name or user.email }}</span>
  <a href="/account" class="small">Compte</a>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf(request) }}"><button class="sec">Déconnexion</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
