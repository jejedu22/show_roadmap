expose_php = Off
memory_limit = 256M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; Import des classeurs Excel : jusqu'à 20 fichiers de 10 Mo
upload_max_filesize = 10M
post_max_size = 64M
max_file_uploads = 20
